services:
  kafka:
    image: apache/kafka:3.9.0   # pinned: "latest" can silently change behavior between runs
    container_name: kafka
    ports:
      - "9092:9092"             # EXTERNAL listener: for code running on your Mac (generators, local Spark)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Two listeners are needed because "where is Kafka?" has a different answer depending on
      # who is asking. Containers reach it at kafka:19092; your Mac reaches it at localhost:9092.
      # Getting this wrong is the #1 cause of "connection refused" errors with Kafka in Docker.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single broker, so replication factor can't exceed 1 (Kafka's defaults assume 3 brokers
      # and the broker would fail to start without these overrides).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics are created explicitly (kafka-init below), never implicitly. A typo in a topic
      # name would otherwise silently create a new, wrong topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data   # named volume: data survives restarts; `down -v` wipes it
    healthcheck:
      # Other services wait for this, so they don't start before Kafka can accept connections.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"               # one-shot job: create topics, then exit
    # 3 partitions per topic matches the roadmap's baseline; the 3-vs-6 partition experiment comes in Week 10.
    # --if-not-exists makes this idempotent, so re-running `make up` is safe.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in driver_events ride_requests driver_events.dlq ride_requests.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092   # internal address, since UI runs inside Docker

volumes:
  kafka-data:
